version: 2
updates:
  # Rust workspace (crates/nebula-import)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]

  # Android app: Gradle plugins, libraries and the Gradle wrapper
  - package-ecosystem: "gradle"
    directory: "/platform/android"
    schedule:
      interval: "weekly"
    groups:
      gradle-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # core-ktx 1.19 needs compileSdk 37 (checkReleaseAarMetadata fails on 36); drop this when app/build.gradle.kts
      # moves to compileSdk 37.
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.19"]
