# Compiles every part of Nebula and runs its tests on each pull request and each push to main (docs/BUILDING.md), and
# keeps what it built as test builds for Windows, Linux, Android and macOS: downloads for 14 days (docs/TEST_BUILDS.md).
# Releases are built from a version tag by the Release workflow (release.yml, docs/BUILDING.md "Releases").
name: Build

on:
  # A push to a pull request's branch is built by the pull_request trigger: building it on push too ran every change
  # twice at once.
  push:
    branches: [main]
  # Every pull request, so that the Build result check always reports and can be required. Which jobs run is decided by
  # the Changes job below, for pushes to main and pull requests alike: a change that touches nothing they use skips
  # them, which counts as passing.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The SDL host's dependencies (platform/sdl/CMakeLists.txt, NEBULA_DEPS), at the versions cmake/vulkan_deps.cmake
  # pins for the Windows build.
  SDL_TAG: release-3.4.18
  VULKAN_SDK_TAG: vulkan-sdk-1.4.350.1
  VMA_TAG: v3.4.0
  GLSLANG_TAG: 16.6.0
  SPIRV_TOOLS_COMMIT: ef96ed763b43b59b33b31b362f09a02b729fa1c9
  SPIRV_HEADERS_COMMIT: 496543121ce6419f23d6fa5d7194ba66c36212d2

jobs:
  # Sorts the changed files into what they affect:
  #   game:      the host, the game module, the disc import tool and the Windows, Linux and Android test builds;
  #   installer: the launcher, Nebula Settings and Setup (installer/), and their tests.
  # Documentation, the other workflows, NebulaNet and tools/ affect neither. A file both use (the icon the host and
  # the launcher are both built with, the save format version the launcher reads) and this workflow itself run both.
  # Run workflow builds everything.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Reads the earlier Build runs of main.
      actions: read
    outputs:
      game: ${{ steps.filter.outputs.game }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - uses: actions/Checkout@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          # A pull request: its merge commit and the base branch it was merged onto (the first parent).
          # A push: the pushed commit (the commit it is compared with is fetched below).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          all() {
            echo "Building everything: $1"
            { echo game=true; echo installer=true; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          # The commit of the newest finished Build of main whose Build result passed. A push is compared with it, not
          # with the commit before it: a push cancels the run still going for the one before (concurrency above), so
          # a game change followed by a docs change would otherwise never be built. A failed build is not counted
          # either, so its changes are built again by the next push until one passes.
          last_good() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=completed&per_page=30" \
              --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")
                    | select(.conclusion == "success" or .conclusion == "failure") | "\(.id) \(.head_sha)"' |
            while read -r id sha; do
              result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == "Build result") | .conclusion')
              if [ "$result" = success ]; then
                echo "$sha"
                break
              fi
            done
          }
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # The whole pull request, so a cancelled run for an earlier push to it loses nothing.
              files=$(git diff --name-only HEAD^1 HEAD) ;;
            push)
              base=$(last_good || true)
              # None in the last 30 runs, or a commit no longer on GitHub (a force push): nothing to compare with.
              if [ -z "$base" ] || ! git fetch -q --depth=1 origin "$base"; then
                all "no passing build of main to compare with"
              fi
              echo "Compared with $base, the last commit of main that built."
              files=$(git diff --name-only "$base" HEAD) ;;
            *)
              all "$GITHUB_EVENT_NAME" ;;
          esac
          game=false
          installer=false
          while IFS= read -r file; do
            case "$file" in
              "") ;;
              .github/workflows/build.yml) game=true; installer=true ;;
              *.md | docs/* | LICENSE | .github/* | nebulanet/* | lumalink/* | tools/*) ;;
              installer/assets/* | runtime/include/galaxy/store_version.inc) game=true; installer=true ;;
              installer/*) installer=true ;;
              *) game=true ;;
            esac
          done <<< "$files"
          echo "$(printf '%s\n' "$files" | grep -c .) changed files, the first 100:"
          printf '%s\n' "$files" | head -n 100 | sed 's/^/  /'
          echo "Game: $game. Installer: $installer."
          { echo "game=$game"; echo "installer=$installer"; } >> "$GITHUB_OUTPUT"

  import:
    name: Disc import tool (Rust)
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: windows-2025
    env:
      # The C runtime linked in, as Setup ships it: it runs on PCs without the Visual C++ runtime.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/Checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Start sccache
        run: sccache --start-server
      - name: Build
        run: cargo build --release --locked -p nebula-import
      - name: Test
        run: cargo test --locked -p nebula-import
      - uses: actions/upload-artifact@v7
        with:
          name: windows-import
          path: target/release/nebula-import.exe
          retention-days: 1
          if-no-files-found: error

  host:
    name: Host (${{ matrix.renderer }})
    needs: changes
    if: needs.changes.outputs.game == 'true'
    # Visual Studio 2022's MSVC: with 2026's (MSVC 19.51, windows-2025) the frame interpolation and interp GPU
    # tests fail every palette check, which no other compiler reproduces.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: Direct3D 12
            vulkan: OFF
          - renderer: Vulkan
            vulkan: ON
    env:
      # Compile on this machine when the sccache server can't be reached mid-build, instead of failing.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/Checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # The libraries CMake builds at configure time (zlib, xz, libarchive, the FidelityFX SDK) and the downloaded
      # Vulkan sources: each is skipped when its files are already in the build tree.
      - name: Cache configure-time dependencies
        uses: actions/cache@v6
        with:
          path: |
            build/host/archive-deps
            build/host/fidelityfx.built
            build/host/_deps
          key: host-deps-${{ matrix.vulkan }}-${{ hashFiles('cmake/**', 'third_party/archive/**') }}
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Start sccache
        run: sccache --start-server
      - name: Configure
        # Without cross-file optimization: the link of every test against the renderer library otherwise takes
        # minutes. Release builds keep it (NEBULA_HOST_IPO defaults to ON).
        run: >-
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=${{ matrix.vulkan }}
          -DNEBULA_HOST_IPO=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
      # The Vulkan build makes both programs: the test build's.
      - if: matrix.vulkan == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: windows-hosts
          path: |
            build/host/NebulaNative.exe
            build/host/NebulaNativeVk.exe
          retention-days: 1
          if-no-files-found: error
      # The shader tools the Android build runs on this machine (platform/sdl's NEBULA_HOST_TOOLS).
      - if: matrix.vulkan == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: spirv-tools
          path: |
            build/host/galaxy_native_spirv.exe
            build/host/galaxy_utility_spirv.exe
          retention-days: 1
          if-no-files-found: error

  game:
    name: Game module
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: windows-2025
    env:
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/Checkout@v7
      - name: Clang version
        run: '& "C:\Program Files\LLVM\bin\clang.exe" --version'
      # Archive deps (zlib, xz, libarchive) built at configure time: skip when already built.
      - name: Cache configure-time dependencies
        uses: actions/cache@v6
        with:
          path: |
            build/game/archive-deps
          key: game-archive-deps-${{ hashFiles('cmake/**', 'third_party/archive/**') }}
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Start sccache
        run: sccache --start-server
      - name: Build
        run: .\native\build.ps1 -Petari native\petari -Build build\game
      - uses: actions/upload-artifact@v7
        with:
          name: windows-game-module
          path: build/game/smg_game.dll
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Windows test build
    # What the jobs above built and tested, put together: nothing is compiled again.
    needs: [import, host, game]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/Checkout@v7
        with:
          sparse-checkout: |
            LICENSE
            THIRD-PARTY-NOTICES.md
            docs/TEST_BUILDS.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - name: Stage
        run: cp LICENSE THIRD-PARTY-NOTICES.md docs/TEST_BUILDS.md dist/
      - uses: actions/upload-artifact@v7
        with:
          name: nebula-windows-x64
          path: dist
          retention-days: 14
          if-no-files-found: error

  linux:
    name: Linux
    # Needs the game module job: if the game module doesn't build, the Linux binary is useless.
    needs: [changes, game]
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/Checkout@v7
      - name: System packages
        # SDL3's video, audio and input back ends (X11, Wayland, ALSA, PulseAudio, PipeWire, udev).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build patchelf \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev libegl-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          mkdir -p deps && cd deps
          clone() { git -c advice.detachedHead=false clone -q --depth 1 --branch "$2" "https://github.com/$1" "$3"; }
          pin() { mkdir -p "$3" && git -C "$3" init -q && git -C "$3" fetch -q --depth 1 "https://github.com/$1" "$2" &&
                  git -C "$3" -c advice.detachedHead=false checkout -q FETCH_HEAD; }
          clone libsdl-org/SDL "$SDL_TAG" SDL3-3.4.18
          clone KhronosGroup/Vulkan-Headers "$VULKAN_SDK_TAG" Vulkan-Headers-vulkan-sdk-1.4.350.1
          clone zeux/volk "$VULKAN_SDK_TAG" volk-vulkan-sdk-1.4.350.1
          clone GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator "$VMA_TAG" VulkanMemoryAllocator-v3.4.0
          clone KhronosGroup/glslang "$GLSLANG_TAG" glslang-src
          pin KhronosGroup/SPIRV-Tools "$SPIRV_TOOLS_COMMIT" glslang-src/External/spirv-tools
          pin KhronosGroup/SPIRV-Headers "$SPIRV_HEADERS_COMMIT" glslang-src/External/spirv-tools/external/spirv-headers
      - name: Host
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S platform/sdl -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release "-DNEBULA_DEPS=$PWD/deps"
          cmake --build build/host --target main
      - name: Game module
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S native -B build/game -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/game --target smg_game
      - name: Disc import tool
        run: cargo build --release --locked -p nebula-import --bin nebula-import
      - name: Stage
        # The program finds libSDL3 and the game module beside it.
        run: |
          mkdir -p dist
          cp build/host/nebula dist/NebulaNative
          cp -L build/host/SDL3/libSDL3.so.0 build/game/libsmg_game.so target/release/nebula-import dist/
          patchelf --set-rpath '$ORIGIN' dist/NebulaNative
          cp LICENSE THIRD-PARTY-NOTICES.md docs/TEST_BUILDS.md dist/
          # Artifacts drop file modes: a tar keeps the programs executable.
          tar -C dist -czf nebula-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: nebula-linux-x64
          path: nebula-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error

  android:
    name: Android
    # The Vulkan host build's shader tools compile the SPIR-V the APK carries.
    # Also needs the game module: if it doesn't build, the APK is useless.
    needs: [changes, host, game]
    if: needs.changes.outputs.game == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/Checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Android SDK
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          # Every licence question answered yes.
          1..20 | ForEach-Object { 'y' } | & $sdkmanager --install 'ndk;28.2.13676358' 'platforms;android-36' |
              Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed ($LASTEXITCODE)" }
      - name: Dependencies
        shell: bash
        run: |
          mkdir -p deps && cd deps
          clone() { git -c advice.detachedHead=false clone -q --depth 1 --branch "$2" "https://github.com/$1" "$3"; }
          pin() { mkdir -p "$3" && git -C "$3" init -q && git -C "$3" fetch -q --depth 1 "https://github.com/$1" "$2" &&
                  git -C "$3" -c advice.detachedHead=false checkout -q FETCH_HEAD; }
          clone libsdl-org/SDL "$SDL_TAG" SDL3-3.4.18
          clone KhronosGroup/Vulkan-Headers "$VULKAN_SDK_TAG" Vulkan-Headers-vulkan-sdk-1.4.350.1
          clone zeux/volk "$VULKAN_SDK_TAG" volk-vulkan-sdk-1.4.350.1
          clone GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator "$VMA_TAG" VulkanMemoryAllocator-v3.4.0
          clone KhronosGroup/glslang "$GLSLANG_TAG" glslang-src
          pin KhronosGroup/SPIRV-Tools "$SPIRV_TOOLS_COMMIT" glslang-src/External/spirv-tools
          pin KhronosGroup/SPIRV-Headers "$SPIRV_HEADERS_COMMIT" glslang-src/External/spirv-tools/external/spirv-headers
      - uses: actions/download-artifact@v8
        with:
          name: spirv-tools
          path: build/spirv-tools
      - name: APK
        # Debug-signed: no -Signing.
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          .\platform\android\build_apk.ps1 -Deps "$PWD\deps" -Work "$PWD\build\android" -HostTools "$PWD\build\spirv-tools"
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-logs
          path: build/android/*.log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: nebula-android
          path: |
            build/android/Nebula.apk
            docs/TEST_BUILDS.md
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS
    # Apple silicon only (the runner's own processor), as platform/apple/build_macos.sh builds it (docs/APPLE.md):
    # the Metal renderer, Apple's host and the game module, packed as Nebula.app. Not in Build result's needs: the
    # Mac port isn't finished, so it doesn't block a merge.
    # Also needs the game module job: if it doesn't build, the app is useless.
    needs: [changes, game]
    if: needs.changes.outputs.game == 'true'
    runs-on: macos-15
    env:
      # docs/APPLE.md, "Toolchain": LLVM 19 (LLVM's own macOS package), and libc++ built from the same release.
      LLVM_VERSION: 19.1.7
      MOLTENVK_TAG: v1.4.2
    steps:
      - uses: actions/Checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ninja
        run: brew install ninja
      # LLVM and the libc++ build_libcxx.sh makes from its sources: the slow part, kept until either changes.
      - name: Cache the toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apple/toolchain
          key: macos-toolchain-arm64-${{ env.LLVM_VERSION }}-${{ hashFiles('platform/apple/build_libcxx.sh') }}
      - name: Toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          tools="$RUNNER_TEMP/apple"
          release="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION"
          mkdir -p "$tools/toolchain/llvm" "$RUNNER_TEMP/llvm-src"
          curl -fsSL "$release/LLVM-$LLVM_VERSION-macOS-ARM64.tar.xz" | tar -xJ --strip-components=1 -C "$tools/toolchain/llvm"
          curl -fsSL "$release/llvm-project-$LLVM_VERSION.src.tar.xz" | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/llvm-src"
          "$tools/toolchain/llvm/bin/clang" --version
          platform/apple/build_libcxx.sh "$RUNNER_TEMP/llvm-src" "$tools/toolchain/llvm" "$tools/toolchain/libcxx" macos arm64
          rm -rf "$tools/toolchain/libcxx/build-macos-arm64"
      - name: Dependencies
        # What the Linux job checks out, and MoltenVK and SPIRV-Cross (platform/apple/CMakeLists.txt).
        run: |
          mkdir -p "$RUNNER_TEMP/apple/deps" && cd "$RUNNER_TEMP/apple/deps"
          clone() { git -c advice.detachedHead=false clone -q --depth 1 --branch "$2" "https://github.com/$1" "$3"; }
          pin() { mkdir -p "$3" && git -C "$3" init -q && git -C "$3" fetch -q --depth 1 "https://github.com/$1" "$2" &&
                  git -C "$3" -c advice.detachedHead=false checkout -q FETCH_HEAD; }
          clone libsdl-org/SDL "$SDL_TAG" SDL3-3.4.18
          clone KhronosGroup/Vulkan-Headers "$VULKAN_SDK_TAG" Vulkan-Headers-vulkan-sdk-1.4.350.1
          clone zeux/volk "$VULKAN_SDK_TAG" volk-vulkan-sdk-1.4.350.1
          clone GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator "$VMA_TAG" VulkanMemoryAllocator-v3.4.0
          clone KhronosGroup/glslang "$GLSLANG_TAG" glslang-src
          pin KhronosGroup/SPIRV-Tools "$SPIRV_TOOLS_COMMIT" glslang-src/External/spirv-tools
          pin KhronosGroup/SPIRV-Headers "$SPIRV_HEADERS_COMMIT" glslang-src/External/spirv-tools/external/spirv-headers
          clone KhronosGroup/SPIRV-Cross "$VULKAN_SDK_TAG" SPIRV-Cross-vulkan-sdk-1.4.350.1
          mkdir -p MoltenVK
          curl -fsSL "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_TAG/MoltenVK-all.tar" | tar -x -C MoltenVK
          if [ ! -f MoltenVK/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib ]; then
            echo "::error::libMoltenVK.dylib is not where platform/apple/CMakeLists.txt looks for it:"
            find MoltenVK -name libMoltenVK.dylib
            exit 1
          fi
      - name: Build
        run: platform/apple/build_macos.sh -t "$RUNNER_TEMP/apple" -w "$RUNNER_TEMP/apple-build" -a arm64
      - name: Stage
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/apple-build/Nebula-macOS.zip" docs/TEST_BUILDS.md dist/
      - uses: actions/upload-artifact@v7
        with:
          name: nebula-macos-arm64
          path: dist
          retention-days: 14
          if-no-files-found: error

  installer:
    name: Installer tests
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-2025
    # Windows PowerShell, as the scripts are run by hand: they compile with the in-box .NET Framework csc.exe and load
    # its System.Drawing.
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/Checkout@v7
      # The launcher's first start, settings form, launch arguments and folder moves, Setup's cases, and nebula.ico in
      # every executable: against a stub game, with its own %LOCALAPPDATA%.
      - name: Launcher and Setup
        run: .\installer\tests\run-launcher-tests.ps1
      - name: Update channels
        run: .\installer\tests\run-beta-updater-tests.ps1
      # The update path end to end on a local release server, with a signing key made for the run.
      - name: Update flow
        run: .\installer\tests\run-update-flow-tests.ps1

  # The one check to require before merging: it fails when the Windows build (host, game module, disc import tool and
  # the test build put together from them) or the installer tests failed or were cancelled, and passes when they passed
  # or were skipped. Linux, Android and macOS are still built and show their own checks, but don't block a merge: those
  # ports aren't finished.
  result:
    name: Build result
    if: always()
    needs: [changes, import, host, game, windows, installer]
    runs-on: ubuntu-24.04
    steps:
      - name: Check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
